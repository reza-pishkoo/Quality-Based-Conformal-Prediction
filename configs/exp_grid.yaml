experiment_name: grid_demo
output_dir: outputs
output_csv: outputs/grid_demo.csv   # <- one file per grid config


seed: 2025          # default if seeds not given
seeds: [1, 2, 3]    # or omit and we’ll use `seed` only

data:
  size_old: 10000
  size_new: [1000, 2000]   # SCALAR OR LIST
  p_old: [0.5, 0.7]        # SCALAR OR LIST
  p_new: [0.5]             # SCALAR OR LIST
  w_old: [1.0, 0.0]
  b_old: 0.0
  w_new: [0.6, 0.8]
  b_new: -0.2
  sigma_x: 1.0
  eta_old: 0.0
  eta_new: 0.0
  tau_easy: 1.0

split:
  cal_frac: 0.5

cp:
  alpha: 0.1
