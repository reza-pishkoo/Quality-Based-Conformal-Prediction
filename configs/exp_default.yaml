seed: 2025
experiment_name: exp_default
output_dir: outputs
output_csv: outputs/exp_default_results.csv

data:
  size_old: 10000
  size_new: 2000
  c_old: [0.6, 0.4]
  c_new: [0.6, 0.4]
  rho2: 0.8
  mu0: [-3.0, 0.0]
  mu1: [ 3.0, 0.0]
  mu2: [ 0.0, 3.0]
  var0: 1.2
  var1: 0.8
  var2: 1.5
  cov_off: 0.1

split:
  train_frac: 0.4   # NEW-TRAIN for new+quality
  cal_frac:   0.3   # NEW-CAL for CP
  # test_frac = 0.3 (implied)

refine:
  lam: 0.5       # shrink factor for p_new
  beta: 0.0     # bias term for p_new

quality:
  mc_samples: 1  # >1 does Monte Carlo averaging (soft target)
  balanced: false

cp:
  alpha: 0.1
  method: "score"   # you already default to this; try "cumulated_score" too
  
comparison:
  enable: true
  impl: condtrust
  classifiers: ["old","new"]
